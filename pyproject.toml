[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoremove-torrents"
dynamic = ["version"]
description = "Automatically remove torrents according to your strategies."
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jerrymakesjelly", email = "ganzhaoyu037@gmail.com" }]
keywords = ["python", "autoremove", "torrent"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
requires-python = ">=3.9"
dependencies = [
    "deluge-client",
    "ply",
    "pyyaml",
    "requests",
]

[project.urls]
Homepage = "https://github.com/jerrymakesjelly/autoremove-torrents"
Documentation = "https://autoremove-torrents.readthedocs.io/"

[project.scripts]
autoremove-torrents = "autoremovetorrents.main:main"

[tool.setuptools.packages.find]
include = ["autoremovetorrents*"]

[tool.setuptools.dynamic]
version = { attr = "autoremovetorrents.version.__version__" }
