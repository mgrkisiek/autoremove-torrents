# On a version tag (e.g. v1.6.0): build the Python packages, publish the Docker image
# to GitHub Container Registry and create a GitHub release with the packages attached.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Check that the tag matches the package version
      run: |
        version=$(sed -n "s/^__version__ = '\(.*\)'/\1/p" autoremovetorrents/version.py)
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in autoremovetorrents/version.py"
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - name: Build Python packages
      run: |
        python -m pip install --upgrade build
        python -m build

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/* \
          --title "$GITHUB_REF_NAME" \
          --notes "See the [changelog](https://github.com/${{ github.repository }}/blob/$GITHUB_REF_NAME/docs/changelog.rst) for details.

        Docker image: \`ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}\`"
